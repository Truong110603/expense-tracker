<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Đăng nhập</h1>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Mật khẩu"
            required
        >

        <button type="submit">
            Đăng nhập
        </button>

    </form>

    <p>
        Chưa có tài khoản?
        <a href="register.html">Đăng ký</a>
    </p>

    <p id="message"></p>

</div>

<script src="login.js"></script>

</body>
</html>
